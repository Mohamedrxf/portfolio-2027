<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:#000">
<iframe id="f" src="http://localhost:5174/" style="width:1440px;height:900px;border:none;overflow:hidden"></iframe>
<script>
(async () => {
  const f = document.getElementById('f');
  await new Promise(r => { f.onload = r; });
  const targets = [
    { name: 'marquee', y: 950 },
    { name: 'about', y: 1900 },
    { name: 'services', y: 3100 },
    { name: 'projects', y: 4300 },
    { name: 'contact', y: 9000 },
  ];
  for (const t of targets) {
    f.contentWindow.scrollTo(0, t.y);
    await new Promise(r => setTimeout(r, 900));
    // capture iframe via html2canvas not available; instead use window.print trick
    window.print = () => {};
    // Use the iframe's own screenshot capability is not available; signal via title
    document.title = 'CAP_' + t.name;
    await new Promise(r => setTimeout(r, 300));
  }
  document.title = 'DONE';
})();
</script>
</body>
</html>
